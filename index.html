<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novedades Documentales · Septiembre 2026</title>
<style>
:root {
  --purple:#4d1d91; --purple2:#6734b4; --purple3:#3b1477;
  --ink:#17245b; --muted:#6c6f8d; --line:#e4deef;
  --pink:#ef3f83; --cyan:#22d6d0; --bg:#f7f5fb;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.hero{height:300px;background:linear-gradient(110deg,var(--purple3),#6231ad 62%,#4c1c8d);position:relative;overflow:hidden;color:white}
.hero:after{content:"";position:absolute;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;background:rgba(255,255,255,.035)}
.hero-inner{max-width:1320px;height:100%;margin:auto;padding:42px 34px;position:relative;z-index:2}
.kicker{color:#2de0d9;font-weight:800;letter-spacing:2px;font-size:13px;text-transform:uppercase;margin:12px 0 24px}
.kicker:before{content:"";display:inline-block;width:23px;height:3px;background:#2de0d9;border-radius:3px;margin:0 9px 3px 0}
h1{font-size:56px;line-height:.98;margin:0;font-weight:900;letter-spacing:-2px;max-width:600px}
.subtitle{font-size:18px;margin-top:22px;color:#f3effa}
.mascot{position:absolute;right:32px;bottom:4px;height:290px;object-fit:contain;filter:drop-shadow(0 12px 15px rgba(0,0,0,.12))}
.filters{background:white;border-bottom:1px solid var(--line);padding:18px 34px;display:flex;align-items:center;gap:38px}
.filter-label{font-size:12px;font-weight:900;letter-spacing:1.5px;color:#766f91;text-transform:uppercase}
.select-wrap{position:relative}
select{appearance:none;border:1px solid #ddd7e8;border-radius:28px;background:#fff;padding:14px 48px 14px 20px;font-size:15px;font-weight:700;color:#34315b;min-width:290px;outline:none;cursor:pointer}
.select-wrap:after{content:"";position:absolute;right:20px;top:50%;margin-top:-3px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid #5b3197;pointer-events:none}
.counter{margin-left:auto;color:#77708c;font-weight:700;font-size:14px}
main{max-width:1320px;margin:auto;padding:36px 34px 55px}
.section-title{font-size:25px;font-weight:900;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.card{background:white;border:1px solid #e6e0ef;border-radius:16px;overflow:hidden;box-shadow:0 5px 16px rgba(57,28,101,.07);display:flex;flex-direction:column}
.card-head{background:linear-gradient(90deg,#4e1f91,#6030aa);color:white;padding:13px 18px;display:flex;justify-content:space-between;align-items:center}
.proc{font-size:12px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase}
.date{background:#ef3f83;border-radius:18px;padding:6px 13px;font-size:12px;font-weight:900}
.card-body{padding:17px 19px 20px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.chip{background:#f7f5fb;border:1px solid #e1dced;border-radius:18px;padding:6px 11px;font-size:12px;font-weight:800;color:#5a5373}
.name{font-size:20px;line-height:1.14;font-weight:900;margin:0 0 17px;color:#17245b}
.change-title{font-size:11px;letter-spacing:1.5px;font-weight:900;color:#d73475;text-transform:uppercase;border-bottom:2px solid #35c9c6;padding-bottom:8px;margin-bottom:12px}
.change{font-size:14px;line-height:1.55;color:#404463;white-space:pre-line}
.change p{margin:0 0 11px}
.empty{background:white;border:1px dashed #d7cfe5;border-radius:16px;padding:35px;text-align:center;color:#77708c}
.footer{text-align:center;color:#8a839b;font-size:12px;padding:0 20px 30px}
@media(max-width:850px){
 .grid{grid-template-columns:1fr} .hero{height:330px} .mascot{height:190px;right:-5px;opacity:.75}
 h1{font-size:42px} .filters{flex-wrap:wrap;gap:10px 18px} .counter{width:100%;margin-left:0}
}
</style>
</head>

const grid = document.getElementById('grid');
const counter = document.getElementById('counter');
const filter = document.getElementById('processFilter');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const value = filter.value;
  const list = value === 'ALL' ? docs : docs.filter(d => d.proceso === value);
  counter.textContent = `Mostrando ${list.length} de ${docs.length} documentos`;

  if (!list.length) {
    grid.innerHTML = '<div class="empty">No hay documentos para el proceso seleccionado.</div>';
    return;
  }

  grid.innerHTML = list.map(d => `
    <article class="card">
      <div class="card-head">
        <div class="proc">${esc(d.proceso)}</div>
        <div class="date">${esc(d.fecha)}</div>
      </div>
      <div class="card-body">
        <div class="meta">
          <span class="chip">${esc(d.codigo)}</span>
          <span class="chip">Versión ${esc(d.version)}</span>
        </div>
        <h3 class="name">${esc(d.nombre)}</h3>
        <div class="change-title">Control de cambios</div>
        <div class="change">${esc(d.cambios).replace(/\n\s*\n/g, '\n\n')}</div>
      </div>
    </article>
  `).join('');
}
filter.addEventListener('change', render);
render();
</script>
